# Integración continua: tipos, lint, pruebas (unitarias y de integración
# contra PostgreSQL) y build de producción en cada push y pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ietic
          POSTGRES_PASSWORD: ietic27-ci
          POSTGRES_DB: ietic27_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ietic -d ietic27_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ietic:ietic27-ci@localhost:5432/ietic27_test?schema=public
      TEST_DATABASE_URL: postgresql://ietic:ietic27-ci@localhost:5432/ietic27_test?schema=public
      AUTH_SECRET: solo-para-ci-no-es-un-secreto
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src --ext .ts,.tsx
      - run: npm test
      - run: npx prisma db push --skip-generate
      - run: npm run test:int
      - run: npm run build
